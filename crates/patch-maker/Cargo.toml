[package]
name = "patch-maker"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "Patch generation engine and tool for Modern RO Patcher"

[dependencies]
gruf = { path = "../gruf" }
patcher-core = { path = "../patcher-core" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
walkdir = "2.5"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.2"
