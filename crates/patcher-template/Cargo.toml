[package]
name = "patcher-template"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "Client Patcher Template for Modern RO Patcher"

[dependencies]
patcher-core = { path = "../patcher-core" }

tao = "0.37"
wry = "0.57"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
